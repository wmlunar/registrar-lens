<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IANA ID 查询系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .search-section {
            margin-bottom: 40px;
        }

        .search-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #ecf0f1;
        }

        .tab-button {
            padding: 15px 30px;
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #7f8c8d;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-button.active {
            color: #3498db;
            border-bottom-color: #3498db;
        }

        .tab-content {
            display: none;
            padding: 20px 0;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #3498db;
        }

        .textarea-field {
            width: 100%;
            padding: 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 16px;
            min-height: 120px;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        .textarea-field:focus {
            outline: none;
            border-color: #3498db;
        }

        .search-button {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .search-button:hover {
            transform: translateY(-2px);
        }

        .export-section {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .export-button {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .export-button:hover {
            transform: translateY(-1px);
        }

        .export-button:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }

        .results-section {
            margin-top: 30px;
        }

        .results-header {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .result-card {
            background: white;
            border: 1px solid #ecf0f1;
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .result-header {
            background: #3498db;
            color: white;
            padding: 15px 20px;
            font-weight: 600;
        }

        .result-content {
            padding: 20px;
        }

        .result-item {
            background: #f8f9fa;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #3498db;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .registrar-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 12px;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .info-value {
            font-weight: 600;
            color: #2c3e50;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-accredited {
            background: #d4edda;
            color: #155724;
        }

        .status-reserved {
            background: #fff3cd;
            color: #856404;
        }

        .status-terminated {
            background: #f8d7da;
            color: #721c24;
        }

        .match-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .match-rdap {
            background: #d1ecf1;
            color: #0c5460;
        }

        .match-name {
            background: #e2e3e5;
            color: #383d41;
        }

        .rdap-link {
            color: #3498db;
            text-decoration: none;
            word-break: break-all;
        }

        .rdap-link:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #f5c6cb;
            margin: 20px 0;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #c3e6cb;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .main-content {
                padding: 20px;
            }

            .search-tabs {
                flex-direction: column;
            }

            .tab-button {
                text-align: left;
                border-bottom: 1px solid #ecf0f1;
            }

            .registrar-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>IANA ID 查询系统</h1>
            <p>通过二级域名在RDAP Base URL中查询注册商信息 - 支持单个和批量查询</p>
        </div>

        <div class="main-content">
            <div class="search-section">
                <div class="search-tabs">
                    <button class="tab-button active" onclick="switchTab('single')">单个查询</button>
                    <button class="tab-button" onclick="switchTab('batch')">批量查询</button>
                </div>

                <!-- 单个查询 -->
                <div id="single-tab" class="tab-content active">
                    <div class="input-group">
                        <label for="domain-input">输入域名或URL（将提取二级域名）：</label>
                        <input type="text" id="domain-input" class="input-field" 
                               placeholder="例如：nawang.cn, www.zzy.cn, https://www.example.com/path">
                    </div>
                    <button class="search-button" onclick="searchSingle()">查询</button>
                </div>

                <!-- 批量查询 -->
                <div id="batch-tab" class="tab-content">
                    <div class="input-group">
                        <label for="domains-input">输入多个域名（每行一个，将提取二级域名）：</label>
                        <textarea id="domains-input" class="textarea-field" 
                                  placeholder="nawang.cn&#10;www.zzy.cn&#10;https://www.example.com/path&#10;domain4.com"></textarea>
                    </div>
                    <button class="search-button" onclick="searchBatch()">批量查询</button>
                </div>
            </div>

            <div class="loading" id="loading">
                <p>🔍 正在查询中...</p>
            </div>

            <div class="results-section" id="results" style="display: none;">
                <!-- 结果将在这里显示 -->
            </div>
        </div>
    </div>

    <script>
        // 全局变量存储当前查询结果
        let currentSingleResult = null;
        let currentBatchResults = null;

        function switchTab(tabName) {
            // 隐藏所有标签页内容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // 移除所有按钮的active类
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('active');
            });
            
            // 显示选中的标签页
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
            
            // 清空结果
            document.getElementById('results').style.display = 'none';
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showError(message) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `<div class="error-message">❌ ${message}</div>`;
            resultsDiv.style.display = 'block';
        }

        function getStatusBadgeClass(status) {
            switch(status.toLowerCase()) {
                case 'accredited': return 'status-accredited';
                case 'reserved': return 'status-reserved';
                case 'terminated': return 'status-terminated';
                default: return 'status-reserved';
            }
        }

        function formatResults(data) {
            let html = '';
            
            if (data.batch_results) {
                // 批量查询结果
                html += `<div class="results-header">
                    <h3>批量查询结果</h3>
                    <p>处理了 ${data.processed_count} 个域名</p>
                </div>`;
                
                // 添加批量导出按钮
                html += `<div class="export-section">
                    <h4>导出结果</h4>
                    <div class="export-buttons">
                        <button class="export-button" onclick="exportBatchResults('csv')">
                            📄 导出为CSV
                        </button>
                        <button class="export-button" onclick="exportBatchResults('excel')">
                            📊 导出为Excel
                        </button>
                    </div>
                </div>`;
                
                data.batch_results.forEach((result, index) => {
                    html += `<div class="result-card">
                        <div class="result-header">
                            ${index + 1}. ${result.domain_input}
                        </div>
                        <div class="result-content">`;
                    
                    if (result.error) {
                        html += `<div class="error-message">${result.error}</div>`;
                    } else if (result.results.length === 0) {
                        html += `<p>未找到相关注册商信息</p>`;
                    } else {
                        html += `<p><strong>解析的域名核心：</strong>${result.domain_core}</p>
                                <p><strong>找到 ${result.total} 个相关注册商：</strong></p>`;
                        
                        result.results.forEach(registrar => {
                            html += formatRegistrarInfo(registrar);
                        });
                    }
                    
                    html += `</div></div>`;
                });
            } else {
                // 单个查询结果
                html += `<div class="results-header">
                    <h3>查询结果</h3>
                    <p><strong>输入：</strong>${data.domain_input}</p>
                    <p><strong>提取的二级域名：</strong>${data.domain_core}</p>
                    <p><strong>找到 ${data.total} 个相关注册商</strong></p>
                </div>`;
                
                // 添加单个查询导出按钮
                if (data.results.length > 0) {
                    html += `<div class="export-section">
                        <h4>导出结果</h4>
                        <div class="export-buttons">
                            <button class="export-button" onclick="exportSingleResults('csv')">
                                📄 导出为CSV
                            </button>
                            <button class="export-button" onclick="exportSingleResults('excel')">
                                📊 导出为Excel
                            </button>
                        </div>
                    </div>`;
                }
                
                if (data.results.length === 0) {
                    html += `<div class="result-card">
                        <div class="result-content">
                            <p>未找到相关注册商信息</p>
                        </div>
                    </div>`;
                } else {
                    data.results.forEach(registrar => {
                        html += `<div class="result-card">
                            <div class="result-content">
                                ${formatRegistrarInfo(registrar)}
                            </div>
                        </div>`;
                    });
                }
            }
            
            return html;
        }

        function formatRegistrarInfo(registrar) {
            let matchTypeText = '';
            let matchTypeBadge = '';
            
            if (registrar.match_type === 'rdap_url') {
                matchTypeText = 'RDAP URL匹配';
                matchTypeBadge = '<span class="match-badge match-rdap">RDAP URL匹配</span>';
            } else if (registrar.match_type === 'registrar_name') {
                matchTypeText = '注册商名称匹配';
                matchTypeBadge = '<span class="match-badge match-name">名称匹配</span>';
            }
            
            return `<div class="result-item">
                <div class="registrar-info">
                    <div class="info-item">
                        <span class="info-label">IANA ID</span>
                        <span class="info-value">${registrar.iana_id}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">注册商名称</span>
                        <span class="info-value">${registrar.registrar_name}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">状态</span>
                        <span class="status-badge ${getStatusBadgeClass(registrar.status)}">${registrar.status}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">RDAP URL</span>
                        <span class="info-value">
                            ${registrar.rdap_url ? 
                                `<a href="${registrar.rdap_url}" target="_blank" class="rdap-link">${registrar.rdap_url}</a>` : 
                                '暂无'}
                        </span>
                    </div>
                    ${registrar.match_type ? `
                    <div class="info-item">
                        <span class="info-label">匹配类型</span>
                        <span class="info-value">${matchTypeBadge}</span>
                    </div>` : ''}
                </div>
            </div>`;
        }

        async function searchSingle() {
            const domain = document.getElementById('domain-input').value.trim();
            
            if (!domain) {
                showError('请输入域名');
                return;
            }
            
            showLoading();
            
            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ domain: domain })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || '查询失败');
                }
                
                hideLoading();
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = formatResults(data);
                resultsDiv.style.display = 'block';
                
                // 保存结果用于导出
                currentSingleResult = data;
                currentBatchResults = null;
                
            } catch (error) {
                hideLoading();
                showError(error.message);
            }
        }

        async function searchBatch() {
            const domains = document.getElementById('domains-input').value.trim();
            
            if (!domains) {
                showError('请输入域名列表');
                return;
            }
            
            showLoading();
            
            try {
                const response = await fetch('/batch_search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ domains: domains })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || '批量查询失败');
                }
                
                hideLoading();
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = formatResults(data);
                resultsDiv.style.display = 'block';
                
                // 保存结果用于导出
                currentBatchResults = data;
                currentSingleResult = null;
                
            } catch (error) {
                hideLoading();
                showError(error.message);
            }
        }

        // 回车键触发搜索
        document.getElementById('domain-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchSingle();
            }
        });

        // 导出功能
        async function exportSingleResults(format) {
            if (!currentSingleResult || !currentSingleResult.results.length) {
                alert('没有可导出的数据');
                return;
            }

            try {
                const response = await fetch('/export', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        export_data: currentSingleResult.results,
                        format: format,
                        query_info: {
                            domain_input: currentSingleResult.domain_input,
                            domain_core: currentSingleResult.domain_core
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error('导出失败');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                
                // 从响应头获取文件名
                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = `IANA_Query_Result.${format === 'excel' ? 'xlsx' : 'csv'}`;
                if (contentDisposition) {
                    // 处理UTF-8编码的文件名
                    const matches = contentDisposition.match(/filename\*=UTF-8''(.+)/) || 
                                   contentDisposition.match(/filename=(.+)/);
                    if (matches) {
                        filename = decodeURIComponent(matches[1]);
                    }
                }
                
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
            } catch (error) {
                alert('导出失败: ' + error.message);
            }
        }

        async function exportBatchResults(format) {
            if (!currentBatchResults || !currentBatchResults.batch_results.length) {
                alert('没有可导出的数据');
                return;
            }

            try {
                const response = await fetch('/batch_export', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        batch_data: currentBatchResults.batch_results,
                        format: format
                    })
                });

                if (!response.ok) {
                    throw new Error('导出失败');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                
                // 从响应头获取文件名
                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = `IANA_Batch_Query_Result.${format === 'excel' ? 'xlsx' : 'csv'}`;
                if (contentDisposition) {
                    // 处理UTF-8编码的文件名
                    const matches = contentDisposition.match(/filename\*=UTF-8''(.+)/) || 
                                   contentDisposition.match(/filename=(.+)/);
                    if (matches) {
                        filename = decodeURIComponent(matches[1]);
                    }
                }
                
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
            } catch (error) {
                alert('导出失败: ' + error.message);
            }
        }
    </script>
</body>
</html>
